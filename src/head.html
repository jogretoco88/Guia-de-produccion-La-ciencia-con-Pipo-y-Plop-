<title>Guía de producción · La ciencia con Pipo y Plop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: hoja de rodaje. Cabecera breve, barra fija con pestañas y episodios, una columna de 820px.
   Cada toma es una tira: riel con ID y tiempo a la izquierda; voz, lo que se ve y el prompt a la derecha.
   Paleta tomada del elenco: azul verdoso de Pipo (acento), verde lima de Plop (hecho), mostaza del chaleco
   (láminas) y terracota de la pajarita (avisos), sobre el blanco roto del ciclorama. */
:root{
  --bg:#edf2f2; --surface:#ffffff; --sunken:#f3f7f7;
  --ink:#10272b; --mut:#4c6266; --line:#cddada;
  --pipo:#0a7887; --pipo-soft:#d8edf0; --on-pipo:#ffffff;
  --plop:#4a780a; --plop-soft:#e5f1cc;
  --vest:#7d5b00; --vest-soft:#fbeec0; --vest-line:#e2c35a;
  --bow:#a8451a; --bow-soft:#f9e2d6;
  --fd:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --fb:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1719; --surface:#152225; --sunken:#101b1e;
  --ink:#e4eeef; --mut:#98adb1; --line:#293a3e;
  --pipo:#56c4d2; --pipo-soft:#12363c; --on-pipo:#052328;
  --plop:#a6d660; --plop-soft:#22330f;
  --vest:#e8c24a; --vest-soft:#352b0b; --vest-line:#6b5714;
  --bow:#f0966a; --bow-soft:#3d1f10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1719; --surface:#152225; --sunken:#101b1e;
  --ink:#e4eeef; --mut:#98adb1; --line:#293a3e;
  --pipo:#56c4d2; --pipo-soft:#12363c; --on-pipo:#052328;
  --plop:#a6d660; --plop-soft:#22330f;
  --vest:#e8c24a; --vest-soft:#352b0b; --vest-line:#6b5714;
  --bow:#f0966a; --bow-soft:#3d1f10; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--pipo);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pipo)}

/* Cabecera */
.top{padding-block:22px 10px}
.eyebrow{margin:0 0 2px;font:600 .74rem/1.2 var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--pipo)}
h1{margin:0;font:600 1.75rem/1.15 var(--fd);text-wrap:balance}
.lede{margin:6px 0 0;color:var(--mut);max-width:62ch}

/* Barra fija: pestañas + episodios */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:8px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.row::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:40px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 .95rem var(--fd)}
.tab[aria-selected="true"]{background:var(--pipo);border-color:var(--pipo);color:var(--on-pipo)}
.picker{display:flex;gap:6px;align-items:center;margin-top:8px}
.picker select{flex:1 1 auto;min-width:0;width:100%;text-overflow:ellipsis}
.nav{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font:600 1.2rem/1 var(--fd)}
.nav:disabled{opacity:.4;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.chip{flex:0 0 auto;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;font:600 .84rem var(--fb);color:var(--mut)}
.chip[aria-pressed="true"]{background:var(--pipo-soft);border-color:var(--pipo);color:var(--ink)}
.chip.done::after{content:" \2713";color:var(--plop)}

/* Contenido */
main{padding-block:18px 48px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font:600 1.3rem/1.2 var(--fd);text-wrap:balance}
h3{margin:14px 0 0;font:600 1.02rem/1.25 var(--fd);color:var(--pipo);text-wrap:balance}
p{margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel>h3:first-child{margin-top:0}
.mut{color:var(--mut);font-size:.92rem}
.secret{font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.stats li{padding:4px 10px;border-radius:999px;background:var(--pipo-soft);font:600 .82rem var(--fb);font-variant-numeric:tabular-nums}
.note{padding:10px 12px;border-radius:10px;background:var(--bow-soft);color:var(--ink);font-size:.92rem}
.note b{color:var(--bow)}
.prose{max-width:66ch;display:flex;flex-direction:column;gap:8px}
ul.plain,ol.plain{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px}
ul.plain li::marker{color:var(--pipo)}

/* Progreso y pasos */
.barp{height:8px;border-radius:4px;background:var(--pipo-soft);overflow:hidden}
.barp i{display:block;height:100%;background:var(--plop);transition:width .25s}
@media (prefers-reduced-motion:reduce){.barp i{transition:none}}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.step input{width:24px;height:24px;flex:0 0 24px;margin:1px 0 0;accent-color:var(--plop)}
.step b{display:block}
.step span{display:block;font-size:.9rem;color:var(--mut)}
.step.on b{text-decoration:line-through;color:var(--mut)}
.steps{display:flex;flex-direction:column;gap:8px}

/* Bloques copiables */
.copy{margin:0;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--sunken);font:400 .8rem/1.55 var(--fm);white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.copy.txt{font:400 .95rem/1.55 var(--fb)}
.btn{align-self:flex-start;min-height:40px;padding:0 14px;border:1px solid var(--pipo);border-radius:9px;background:var(--pipo);color:var(--on-pipo);font:700 .86rem var(--fb)}
.btn.ghost{background:transparent;color:var(--pipo)}
.cb{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font:700 .74rem/1.2 var(--fb);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}

/* Línea de tiempo a escala: 300 s */
.tl{display:flex;gap:3px;align-items:stretch}
.tb{display:flex;flex-direction:column;gap:4px;min-width:0}
.tb .seg{display:flex;gap:1px;height:22px}
.tb .seg i{display:block;border-radius:2px;background:var(--pipo);min-width:1px}
.tb .seg i.s{background:var(--vest-line)}
.tb .seg i.r{background:var(--plop)}
.tb small{font:600 .7rem/1 var(--fb);color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--pipo);vertical-align:-1px;margin-right:5px}
.legend i.s{background:var(--vest-line)}
.legend i.r{background:var(--plop)}

/* Tira de toma */
.shot{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.shot.still{background:var(--vest-soft);border-color:var(--vest-line)}
.shot.bank{background:var(--plop-soft);border-color:var(--plop)}
.bank .badge{background:var(--plop);color:var(--surface)}
.bank .vo{border-color:var(--plop)}
.bank .note,.still .note{background:var(--surface)}
.rail{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.rail b{font:500 .92rem var(--fm)}
.rail span{font:400 .78rem var(--fm);color:var(--mut)}
.badge{align-self:flex-start;padding:2px 8px;border-radius:6px;background:var(--pipo-soft);font:700 .72rem var(--fb)}
.still .badge{background:var(--vest-line);color:var(--ink)}
.body{display:flex;flex-direction:column;gap:8px;min-width:0}
.vo{margin:0;padding-left:10px;border-left:3px solid var(--pipo);font-weight:700}
.still .vo{border-color:var(--vest)}
.es{font-size:.93rem}
.es b,.meta b{font-weight:700;color:var(--mut)}
.meta{font-size:.86rem;color:var(--mut)}
.flag{display:inline-block;margin:2px 6px 0 0;padding:2px 8px;border-radius:6px;font:700 .76rem var(--fb);background:var(--plop-soft);color:var(--ink)}
.flag.k{background:var(--bow-soft)}
details.alt{border-top:1px solid var(--line);padding-top:8px}
details.alt>summary{cursor:pointer;font:700 .88rem var(--fb);color:var(--pipo);min-height:28px}
details.alt>div{display:flex;flex-direction:column;gap:8px;margin-top:8px}
@media (max-width:560px){
  .shot{grid-template-columns:minmax(0,1fr);gap:8px}
  .rail{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 10px}
  h1{font-size:1.45rem}
}

/* Listas de reglas */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.rule{display:flex;flex-direction:column;gap:2px}
.rule b{font-weight:700}
.rule span{font-size:.9rem;color:var(--mut)}
.src{display:inline-block;margin-left:4px;padding:0 6px;border-radius:5px;border:1px solid var(--line);font:700 .68rem/1.5 var(--fb);color:var(--mut);vertical-align:1px}
.do h3{color:var(--plop)} .dont h3{color:var(--bow)}
dl.fix{margin:0;display:flex;flex-direction:column;gap:10px}
dl.fix dt{font-weight:700}
dl.fix dd{margin:0;font-size:.92rem;color:var(--mut)}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font:700 .74rem var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
td:nth-child(2){font-variant-numeric:tabular-nums;white-space:nowrap}

/* Calculadora */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font:700 .8rem var(--fb);color:var(--mut)}
.calc input{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--sunken);color:var(--ink);font:500 1rem var(--fm)}
.result{font:600 1.05rem var(--fd);font-variant-numeric:tabular-nums}
details.fold{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px}
details.fold>summary{cursor:pointer;font:600 1rem var(--fd)}
details.fold>div{display:flex;flex-direction:column;gap:8px;margin-top:10px}
/* Plan anual */
.eps{display:flex;flex-direction:column;gap:8px}
details.ep{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px}
details.ep>summary{cursor:pointer;line-height:1.75}
details.ep>summary .num{margin-right:4px;font:500 .86rem var(--fm);color:var(--mut);font-variant-numeric:tabular-nums}
details.ep>summary .q{margin-right:6px;font:600 1rem var(--fd)}
details.ep>div{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tag{display:inline-block;margin:0 4px 0 0;padding:0 7px;border-radius:6px;background:var(--pipo-soft);font:700 .7rem/1.7 var(--fb);white-space:nowrap}
.tag.m{background:var(--plop-soft)}
.tag.a{background:var(--vest-soft);box-shadow:inset 0 0 0 1px var(--vest-line)}
.tag.st{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--mut)}
.tag.c1{background:var(--plop-soft)}
.tag.c2{background:var(--vest-soft);box-shadow:inset 0 0 0 1px var(--vest-line)}
.tag.c3{background:var(--bow-soft);box-shadow:inset 0 0 0 1px var(--bow)}
.search{width:100%;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--sunken);color:var(--ink);font:400 1rem var(--fb)}
.bitem{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bitem:last-child{border-bottom:0;padding-bottom:0}
dl.ficha{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:.93rem}
dl.ficha dt{font-weight:700;color:var(--mut)}
dl.ficha dd{margin:0}
@media (max-width:560px){dl.ficha{grid-template-columns:minmax(0,1fr);gap:2px} dl.ficha dd{margin-bottom:6px}}
.pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
select{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--sunken);color:var(--ink);font:600 .9rem var(--fb)}
footer{padding-block:0 28px;color:var(--mut);font-size:.84rem}
</style>
